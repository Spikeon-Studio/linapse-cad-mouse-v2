; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test

[env:seeed_xiao_rp2040]
; The Seeed platform pins Arduino-Pico 4.4.x (January 2025). On some boards
; that core gives "Cannot read consistent data from device 'TLx493D_A2B6'"
; and calibration does not finish. This platform uses a newer core. The
; commit is pinned to keep the build the same on all machines.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = seeed_xiao_rp2040
framework = arduino

board_build.core = earlephilhower
; Set the USB manufacturer and product names so the host service
; (linapse-service) can find the serial port and HID inputs
; (/dev/serial/by-id/usb-Seeed_Studio_CAD_Mouse*). This board file gives
; "Seeed" as the vendor, so set the manufacturer name here.
board_build.arduino.earlephilhower.usb_manufacturer = Seeed Studio
board_build.arduino.earlephilhower.usb_product = CAD Mouse MK2

extra_scripts = pre:test_build_config.py
test_build_src = yes

build_flags = 
	-DUSE_TINYUSB

lib_deps = 
	infineon/XENSIV 3D Magnetic Sensor TLx493D@^1.1.0
	bxparks/AceButton@^1.10.1
	adafruit/Adafruit NeoPixel@^1.12.3

[env:native]
platform = native
test_build_src = yes
build_flags =
	-DUNIT_TEST
	-iquote firmware/test/mocks/native_only
	-I firmware/test/mocks/native_only
	-iquote firmware/test/mocks
	-I firmware/test/mocks
build_src_filter =
	-<*>
	+<controllers/MotionController.cpp>
	+<controllers/TapDetector.cpp>
	+<controllers/EffectEngine.cpp>
	+<controllers/LEDController.cpp>
	+<StateMachine.cpp>
	+<LedConfig.cpp>
	+<SensConfig.cpp>
	+<states/CalibratingState.cpp>
	+<states/ColorConfigState.cpp>
	+<states/IdleState.cpp>
	+<states/SleepState.cpp>
	+<HidSerialCommand.cpp>